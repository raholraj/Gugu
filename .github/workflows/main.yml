name: Build APK from ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -1)
          echo "Found ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted/

      - name: Fix app build.gradle.kts
        run: |
          APP_DIR=$(find extracted -name "app" -type d | head -1)
          PROJECT_ROOT=$(dirname "$APP_DIR")
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV

          cat > "$PROJECT_ROOT/app/build.gradle.kts" << 'APPGRADLE'
          plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.plugin.compose")
            id("com.google.devtools.ksp")
            id("com.google.android.libraries.mapsplatform.secrets-gradle-plugin")
            id("com.google.gms.google-services")
          }

          android {
            namespace = "com.example"
            compileSdk = 35

            defaultConfig {
              applicationId = "com.aistudio.smartvideocutter.wyqztm"
              minSdk = 24
              targetSdk = 35
              versionCode = 1
              versionName = "1.0"
              testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
            }

            buildTypes {
              release {
                isMinifyEnabled = false
                proguardFiles(
                  getDefaultProguardFile("proguard-android-optimize.txt"),
                  "proguard-rules.pro"
                )
              }
            }

            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_11
              targetCompatibility = JavaVersion.VERSION_11
            }

            kotlinOptions {
              jvmTarget = "11"
            }

            buildFeatures {
              compose = true
              buildConfig = true
            }
          }

          secrets {
            propertiesFileName = ".env"
            defaultPropertiesFileName = ".env.example"
          }

          dependencies {
            implementation(platform("androidx.compose:compose-bom:2024.10.01"))
            implementation(platform("com.google.firebase:firebase-bom:33.6.0"))
            implementation("androidx.activity:activity-compose:1.9.3")
            implementation("androidx.compose.material:material-icons-core")
            implementation("androidx.compose.material:material-icons-extended")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.ui:ui-tooling-preview")
            implementation("androidx.core:core-ktx:1.15.0")
            implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
            implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
            implementation("androidx.navigation:navigation-compose:2.8.4")
            implementation("androidx.room:room-runtime:2.6.1")
            implementation("androidx.room:room-ktx:2.6.1")
            implementation("androidx.media3:media3-exoplayer:1.4.1")
            implementation("androidx.media3:media3-ui:1.4.1")
            implementation("androidx.work:work-runtime-ktx:2.10.0")
            implementation("androidx.security:security-crypto:1.1.0-alpha06")
            implementation("io.coil-kt:coil-compose:2.7.0")
            implementation("com.google.firebase:firebase-ai")
            implementation("com.google.firebase:firebase-appcheck-recaptcha")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0")
            implementation("com.squareup.okhttp3:logging-interceptor:4.12.0")
            implementation("com.squareup.moshi:moshi-kotlin:1.15.1")
            implementation("com.squareup.okhttp3:okhttp:4.12.0")
            implementation("com.squareup.retrofit2:retrofit:2.11.0")
            implementation("com.squareup.retrofit2:converter-moshi:2.11.0")
            ksp("androidx.room:room-compiler:2.6.1")
            ksp("com.squareup.moshi:moshi-kotlin-codegen:1.15.1")
            debugImplementation("androidx.compose.ui:ui-tooling")
            debugImplementation("androidx.compose.ui:ui-test-manifest")
          }
          APPGRADLE

      - name: Setup project structure
        run: |
          APP_DIR=$(find extracted -name "app" -type d | head -1)
          PROJECT_ROOT=$(dirname "$APP_DIR")

          cat > "$PROJECT_ROOT/settings.gradle.kts" << 'SETTINGS'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "SmartVideoCutter"
          include(":app")
          SETTINGS

          cat > "$PROJECT_ROOT/build.gradle.kts" << 'ROOTGRADLE'
          plugins {
            id("com.android.application") version "8.5.2" apply false
            id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
            id("com.google.devtools.ksp") version "2.0.21-1.0.27" apply false
            id("com.google.android.libraries.mapsplatform.secrets-gradle-plugin") version "2.0.1" apply false
            id("com.google.gms.google-services") version "4.4.2" apply false
          }
          ROOTGRADLE

          mkdir -p "$PROJECT_ROOT/gradle/wrapper"
          cat > "$PROJECT_ROOT/gradle/wrapper/gradle-wrapper.properties" << 'WRAPPER'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          WRAPPER

          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradlew \
            -o "$PROJECT_ROOT/gradlew"
          chmod +x "$PROJECT_ROOT/gradlew"

          curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar" \
            -o "$PROJECT_ROOT/gradle/wrapper/gradle-wrapper.jar"

          if [ -f "$PROJECT_ROOT/.env.example" ]; then
            sed 's/=.*/=/' "$PROJECT_ROOT/.env.example" > "$PROJECT_ROOT/.env"
          else
            touch "$PROJECT_ROOT/.env"
          fi

          cat > "$PROJECT_ROOT/app/google-services.json" << 'GSJ'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {
                  "package_name": "com.aistudio.smartvideocutter.wyqztm"
                }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "dummy_api_key" }],
              "services": {
                "appinvite_service": { "other_platform_oauth_client": [] }
              }
            }],
            "configuration_version": "1"
          }
          GSJ

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartVideoCutter-debug
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          retention-days: 7
